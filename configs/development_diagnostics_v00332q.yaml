schema_version: 1
revision: v00332q-clean-20epoch-corrected-rgt-causal
status: predeclared_clean_20epoch_diagnostic_not_production_evidence
base_training_config: sage_avo_s01_v0031.yaml
immutable_dataset: ds_v00331_production100_support_aware
experiment_name: sage_avo_s01_v00332q_clean_20epoch_corrected_rgt
seeds: [12345, 23456, 34567]

architectures:
  corrected_rgt_gnn: {rgt_topology: rgt_v3_confidence_blocked, neighbor_scale: 1.0}
  cartesian_gnn: {rgt_topology: cartesian, neighbor_scale: 1.0}
  shuffled_graph: {rgt_topology: shuffled, neighbor_scale: 1.0}
  root_only_gnn: {rgt_topology: rgt_v3_confidence_blocked, neighbor_scale: 0.0}

bounded_training:
  epochs: 20
  evaluation_epochs: [1, 3, 5, 10, 15, 20]
  batch_size: 2
  train_patches_per_epoch: 70
  train_selection: one rotating patch per training realization per epoch
  validation_patches: 40
  validation_selection: two fixed patches per validation realization
  sample_steps_validation: 4
  whole_flow_steps: 4
  whole_patch_shape: [50, 100]
  whole_stride: [25, 50]
  whole_batch_size: 1

objective:
  auxiliary_graph_smoothness: 0.0
  graph_objective: no_aux_graph_loss
  conditional_flow_unchanged: true
  exact_pp_unchanged: true
  contrastive: 0.0
  adaptive_task_weighting: false
  physics_guided_sampling: false

analysis:
  primary_epoch: 20
  reference_epoch_for_trend: 3
  material_neighbor_output_change: 0.01
  reproducible_favorable_seed_count: 3
  decision_policy:
    reproduced: corrected RGT is favorable for all three seeds versus all three controls
    small_reproducible: corrected RGT is favorable for all three seeds versus Cartesian but not all controls
    away_from_faults_only: away-from-fault is favorable for all seeds while fault-corridor is favorable for at most one seed
    seed_dependent: Cartesian paired differences have mixed signs
    harmful: Cartesian mean is harmful and at least two seeds are harmful
    no_reproducible_gain: none of the above
