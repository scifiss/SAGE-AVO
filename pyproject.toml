[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-avo"
version = "0.1.0"
description = "Structure-aware, physics-regularized refinement of low-frequency elastic priors from three-band AVO data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "SAGE-AVO contributors"}]
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "torch-geometric>=2.5"]
notebooks = ["jupyterlab>=4.0", "nbformat>=5.9"]
field = [
  "segyio>=1.9.13",
  "lasio>=0.31",
  "pyseistr>=0.1.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
